<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할 일 목록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>🍓 오늘의 할 일</h1>
    <p>오늘도 하나씩 실천해 봐요!</p>
    
    <div class="input-area">
      <input type="text" id="taskInput" placeholder="할 일을 입력하세요">
      <button id="addButton">추가하기</button>
    </div>

    <!-- 남은 할 일 카운터 및 일괄 삭제 버튼 -->
    <div class="status-bar">
      <span id="taskCount">남은 할 일: 0개</span>
      <div class="bulk-buttons">
        <button id="clearCompletedBtn" class="sub-btn">완료 삭제</button>
        <button id="clearAllBtn" class="sub-btn danger">전체 삭제</button>
      </div>
    </div>

    <!-- [추가] 필터 탭 버튼 영역 -->
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">진행중</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="taskList"></ul>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
