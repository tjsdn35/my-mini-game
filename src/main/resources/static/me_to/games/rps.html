<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가위바위보 게임</title>
  <link rel="stylesheet" href="../css/mini.css">
  <script src="../js/rps.js" defer></script>
  <style>
    .rps-container {
      width: 100%;
      max-width: 720px;
      margin: 20px auto;
      padding: 30px;
      background-color: white;
      border-radius: 18px;
      border: 1px solid #dce5ec;
    }

    /* 상단 점수 및 연승 정보 바 */
    .status-bar {
      display: flex;
      justify-content: space-around;
      background-color: #eef5f0;
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      margin-bottom: 16px;
    }

    /* 5판 3선승제 승수 표시 */
    .round-score {
      font-size: 26px;
      font-weight: bold;
      color: #327a55;
      margin: 8px 0;
    }

    /* 나 vs 컴퓨터 대결 영역 */
    .battle-board {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 20px 0;
      padding: 20px;
      background-color: #f7faf6;
      border-radius: 16px;
    }
    .player-box {
      text-align: center;
      width: 160px;
    }
    .hand-icon {
      font-size: 76px;
      margin: 10px 0;
    }
    .vs-text {
      font-size: 28px;
      font-weight: bold;
      color: #327a55;
    }

    #resultText {
      display: block;
      font-size: 22px;
      margin: 18px 0;
      color: #18324b;
      min-height: 32px;
    }

    /* 선택 버튼 3개 */
    .rps-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 20px 0;
    }
    .rps-btn {
      padding: 20px 10px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
    }
    .rps-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* 게임 시작 / 다음 라운드 버튼 */
    #startBtn {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: bold;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    #startBtn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    /* 승리 축하 화면 스타일 */
    .win-box {
      padding: 30px 20px;
      background-color: #fffdf0;
      border: 2px solid #f1c40f;
      border-radius: 16px;
      margin-top: 10px;
    }
    .win-trophy {
      font-size: 72px;
      margin-bottom: 10px;
    }
    .win-title {
      font-size: 28px;
      color: #d4ac0d;
      margin-bottom: 12px;
    }
    .win-summary {
      font-size: 19px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .win-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .continue-btn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background-color: #327a55;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .restart-btn {
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      background-color: #7f8c8d;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>가위바위보 게임 (5판 3선승제)</h1>
    <p>먼저 3승을 달성해 컴퓨터를 물리치고 최고 점수에 도전하세요!</p>
  </header>

  <main>
    <section class="rps-container">
      <!-- 상단 연승 및 점수 현황 (항상 표시) -->
      <div class="status-bar">
        <span>🔥 현재 연승: <strong id="streak">0</strong>연승</span>
        <span>💰 현재 점수: <strong id="score">0</strong>점</span>
        <span>🏆 최고 점수: <strong id="highScore">0</strong>점</span>
      </div>

      <!-- 1. 기본 대결 화면 -->
      <div id="gameScreen">
        <div class="round-score">
          나 <span id="userWins">0</span> : <span id="computerWins">0</span> 컴퓨터
        </div>

        <div class="battle-board">
          <div class="player-box">
            <h3>나</h3>
            <div id="userHand" class="hand-icon">❓</div>
            <p id="userChoiceName">대기 중</p>
          </div>

          <div class="vs-text">VS</div>

          <div class="player-box">
            <h3>컴퓨터</h3>
            <div id="computerHand" class="hand-icon">❓</div>
            <p id="computerChoiceName">대기 중</p>
          </div>
        </div>

        <strong id="resultText">아래 [게임 시작] 버튼을 눌러주세요!</strong>

        <div class="rps-buttons">
          <button id="scissorsBtn" class="rps-btn" disabled>✌️ 가위</button>
          <button id="rockBtn" class="rps-btn" disabled>✊ 바위</button>
          <button id="paperBtn" class="rps-btn" disabled>🖐️ 보</button>
        </div>

        <button id="startBtn">🎮 게임 시작</button>
      </div>

      <!-- 2. 승리 축하 화면 (3승 달성 시 나타남) -->
      <div id="winScreen" class="win-box" hidden>
        <div class="win-trophy">🏆</div>
        <h2 class="win-title">축하합니다! 매치에서 승리했습니다!</h2>
        <p id="winSummary" class="win-summary"></p>
        <p style="font-weight: bold; margin-bottom: 16px;">점수를 이어서 계속 도전할까요, 아니면 새로 시작할까요?</p>

        <div class="win-actions">
          <button id="continueBtn" class="continue-btn">🔥 이어서 도전하기</button>
          <button id="newGameBtn" class="restart-btn">🔄 끝내고 새로 시작</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a href="../index.html">게임 메뉴로 돌아가기</a>
  </footer>
</body>
</html>
