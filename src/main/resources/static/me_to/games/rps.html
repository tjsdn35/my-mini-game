<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가위바위보 게임</title>
  <!-- 기존 CSS 폴더의 스타일 연결 (상위 폴더로 이동 후 css 폴더 접근) -->
  <link rel="stylesheet" href="../css/mini.css">
  <script src="../js/rps.js" defer></script>
</head>
<body>
  <header>
    <h1>가위바위보 게임</h1>
    <p>가위, 바위, 보 중 하나를 선택해 컴퓨터를 이겨보세요!</p>
  </header>

  <main>
    <section class="game-card">
      <div class="button-row">
        <button id="scissorsBtn">가위</button>
        <button id="rockBtn">바위</button>
        <button id="paperBtn">보</button>
      </div>
      
      <p>컴퓨터 선택: <span id="computerChoice">-</span></p>
      <p>결과: <strong id="resultText">버튼을 눌러주세요!</strong></p>
      <p>내 점수: <span id="score">0</span>점</p>
    </section>
  </main>

  <footer>
    <a href="../index.html">게임 메뉴로 돌아가기</a>
  </footer>
</body>
</html>
