<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보물찾기 게임</title>
  <link rel="stylesheet" href="../css/mini.css">
  <script src="../js/treasure.js" defer></script>
  <style>
    .treasure-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .box-btn {
      height: 80px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .box-btn.treasure {
      background-color: #f1c40f; /* 금색 */
      color: #18324b;
      border: 2px solid #d4ac0d;
    }
    .box-btn.bomb {
      background-color: #e74c3c; /* 빨간색 */
      color: white;
    }
    .box-btn.empty {
      background-color: #95a5a6; /* 회색 */
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>보물찾기 게임</h1>
    <p>5번의 기회 안에 폭탄을 피해 보물을 찾아보세요!</p>
  </header>

  <main>
    <section class="game-card">
      <h2>게임 안내</h2>
      <p id="message">상자를 눌러 보물을 찾으세요. (폭탄 1개 주의!)</p>
      <p>
        남은 기회: <strong id="chances">5</strong>번 | 
        현재 점수: <strong id="score">0</strong>점 | 
        최고 점수: <strong id="highScore">0</strong>점
      </p>

      <div class="treasure-grid">
        <button class="box-btn">1번 상자</button>
        <button class="box-btn">2번 상자</button>
        <button class="box-btn">3번 상자</button>
        <button class="box-btn">4번 상자</button>
        <button class="box-btn">5번 상자</button>
        <button class="box-btn">6번 상자</button>
        <button class="box-btn">7번 상자</button>
        <button class="box-btn">8번 상자</button>
        <button class="box-btn">9번 상자</button>
      </div>

      <button id="resetButton">다시 시작</button>
    </section>
  </main>

	<footer>
		<a href="../arcade.html">🎮 미니게임 로비로 돌아가기</a>
	</footer>

</body>
</html>
