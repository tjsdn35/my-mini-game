<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보물찾기 게임</title>
  <link rel="stylesheet" href="../css/mini.css">
  <script src="../js/treasure.js" defer></script>
  <style>
    /* 교재 CSS-10 Grid 문법 활용: 상자 9개를 3칸씩 배치 */
    .treasure-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .box-btn {
      height: 80px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>보물찾기 게임</h1>
    <p>9개의 상자 중 한 곳에 숨겨진 보물을 찾아보세요!</p>
  </header>

  <main>
    <section class="game-card">
      <h2>게임 안내</h2>
      <p id="message">상자를 눌러 보물을 찾으세요.</p>
      <p>시도 횟수: <span id="tries">0</span>번</p>

      <!-- 9개의 보물 상자 -->
      <div class="treasure-grid">
        <button class="box-btn">1번 상자</button>
        <button class="box-btn">2번 상자</button>
        <button class="box-btn">3번 상자</button>
        <button class="box-btn">4번 상자</button>
        <button class="box-btn">5번 상자</button>
        <button class="box-btn">6번 상자</button>
        <button class="box-btn">7번 상자</button>
        <button class="box-btn">8번 상자</button>
        <button class="box-btn">9번 상자</button>
      </div>

      <button id="resetButton">다시 시작</button>
    </section>
  </main>

  <footer>
    <a href="../index.html">게임 메뉴로 돌아가기</a>
  </footer>
</body>
</html>
