<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>자바스크립트 함수 테스트</title>
</head>
<body>
	<h1>자바스크립트 테스트중...</h1>
	<button id="startButton">게임 시작</button>
	<button class="endButton">게임 종료</button>
	<hr />
	
		<p id="message">게임을 시작해 보세요.</p>
	<input 
		id="playerName" 
		type="text" 
		placeholder="이름을 입력하세요">
	<button id="nameButton">이름 확인</button>
	<hr />

	<section class="card">
		<h1>클릭 점수 게임</h1>
		<p>현재 점수</p>
		<p id="score">0</p>
	<button id="clickButton">눌러 주세요!</button>
		<p id="gameMessage">게임을 시작해 보세요.</p>
	<button id="resetButton">다시 시작</button>
	</section>

	<script src="./js/js.js"></script>
</body>
</html>
