<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>오늘의 나의 활동 기록</title>
	<!-- link태그로 외부 css파일 style.cc 연결 -->
	<link rel="stylesheet" href="./css/style2.css">
	<script src="./js/app2.js" defer></script>
</head>
<body>
	<!-- 나의 라이프 대시보드 블럭 -->
	<!-- 전제 페이지를 한블럭으로 감싸서 세로 맞춤 정렬 -->
	<div class="page">
		<header class="topbar">
			<div>
				<!-- 가운데 큰글자로 나의 라이프 대시보드 제목출력 -->
				<p class="eyebrow">MY DAILY SPACE</p>
				<h1>나의 라이프 대시보드</h1>
				<p class="subtitle">오늘 해야 할 일을 차근차근 완성해 봐요.</p>
			</div>
			<div class="today-box">
				<span class="today-label">TODAY</span>
				<!-- TODAY 제목 -->
				<span id="todayDate">2026년 11월 23일</span>
				<!-- 실제 날짜 -->
			</div>
		</header>
		
		<!-- 가운데 실제 컨텐츠 -->
		<main>
			<!-- main영역중 첫째줄 첫번째 섹션 -->
			<section class="focus-panel">
				<div>
					<p class="eyebrow">TODAY'S FOCUS</p>
					<h2>작은 한 걸음이 큰 변화를 만들어요.</h2>
					<p>오늘의 할 일을 등록하고 하나씩 완료해 보세요.</p>
				</div>
				<div class="focus-mark" aria-hidden="true">√</div>
			</section>
		</main>

		<!-- 회사소개 저작권 기타 사이트맵 꼬리영역이 출력 -->
		<footer>
			<p>나의 라이프 대시보드 - 오늘도 즐겁게 열심히 했어요</p>
		</footer>
		
	</div>
	
</body>
</html>
